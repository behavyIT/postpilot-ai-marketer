# Локальный запуск.
#   Только хранилища (для разработки):  docker compose up -d
#   Всё приложение в контейнерах:       docker compose --profile app up -d --build
# Порты слушают только 127.0.0.1 и не пересекаются с локальным PostgreSQL (5432) и Redis (6379).

name: ai-marketer

x-app: &app
  image: ai-marketer-app:latest
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://aimarketer:aimarketer@postgres:5432/aimarketer
    REDIS_URL: redis://redis:6379/0
  volumes:
    - appdata:/app/data  # файлы пользователей переживают пересоздание контейнеров
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  profiles: ["app"]

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aimarketer
      POSTGRES_PASSWORD: aimarketer
      POSTGRES_DB: aimarketer
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimarketer -d aimarketer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"

  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]

  worker:
    <<: *app
    command: ["taskiq", "worker", "app.workers.broker:broker", "app.workers.tasks"]

volumes:
  pgdata:
  redisdata:
  appdata:
